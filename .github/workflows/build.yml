name: build

# Every step and the plugin have to build on every platform participants bring,
# and every solution has to produce the right numbers. Exercises only build
# once their ? are filled in: filled in from the solution, they have to pass
# like it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
          - name: macOS-x86_64
            os: macos-15-intel
          - name: Linux-x86_64
            os: ubuntu-latest
          - name: Linux-arm64
            os: ubuntu-24.04-arm
          - name: Windows-x86_64
            os: windows-latest
          - name: Windows-arm64
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      # The models never change for a given hash, so they are worth caching:
      # about 400 MB per run otherwise.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: steps/common/assets/models
          key: models-${{ hashFiles('cmake/models.cmake') }}

      # The unpacked engines and JUCE.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('cmake/*.cmake') }}

      # What JUCE needs on a bare Ubuntu runner, and OpenCV for step 11's camera.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxrender-dev libxi-dev \
            libfreetype-dev libfontconfig-dev libopencv-dev

      # On Linux, a missing OpenCV fails the configure instead of a warning.
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWORKSHOP_JUCE=ON -DWORKSHOP_CHECK_EXERCISES=ON \
            -DWORKSHOP_HOST_SLOWDOWN=4 \
            ${{ runner.os == 'Linux' && '-DWORKSHOP_OPENCV_CAMERA=ON' || '' }}

      # A bare --parallel is an unbounded make -j: on the smaller runners the
      # compilers of anira and JUCE together run out of memory, and the runner
      # is shut down.
      - name: Build every step and the plugin
        run: cmake --build build --config Release --parallel 4

      # The solutions carry the claims the workshop makes: the output matches
      # the Python reference, the audio thread allocates nothing, the latency
      # is what we say it is. A non-zero exit fails the run.
      - name: Run the solutions
        shell: bash
        # Steps 6 and 7 pace their host four times slower here, configured
        # above: a shared runner does not keep up with real time
        run: |
          for binary in step01_solution step02_solution step03_solution step04_solution step06_solution step07_solution step09_solution_check step10_solution_check; do
            path=$(find build -name "$binary" -o -name "$binary.exe" | head -1)
            echo "=== $binary"
            "$path"
          done

      # Step 5 is a demonstration; its "verify" mode is the part with a right
      # answer. Skipped on Windows: RealtimeSanitizer is a clang feature, and
      # the step only means something with it.
      - name: Run the real-time safety check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          path=$(find build -name "step05_solution" | head -1)
          "$path" verify

      # Every exercise, its ? filled in from the solution (scripts/fill_exercise.py),
      # has to build and pass like the solution: exercise and solution still
      # match, and no exercise was committed filled in.
      - name: Filled-in exercises pass
        shell: bash
        run: |
          for binary in step01_exercise_filled step02_exercise_filled step03_exercise_filled \
                        step06_exercise_filled \
                        step09_exercise_filled_check step10_exercise_filled_check; do
            cmake --build build --config Release --parallel 4 --target $binary
            path=$(find build -name "$binary" -o -name "$binary.exe" | head -1)
            echo "=== $binary"
            "$path"
          done

      - name: The plugin was built
        shell: bash
        run: find build -name "*.vst3" -o -name "*.app" | head -5
