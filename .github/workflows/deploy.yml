name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub's side can stall a deployment (stuck in syncing_files until the
      # action's timeout cancels it); the next one is then refused while the
      # cancelled one still counts as in progress, at least 6 minutes once.
      # Two retries, after 5 and after 10 minutes.
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the first retry
        if: steps.first.outcome == 'failure'
        run: sleep 300

      - name: Deploy to GitHub Pages, second attempt
        id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the second retry
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 600

      - name: Deploy to GitHub Pages, third attempt
        id: third
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v4
